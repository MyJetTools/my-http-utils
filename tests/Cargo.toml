# Dedicated test crate: exercises the `my_http_utils::macros` derives on many struct
# combinations and asserts the generated THttpRequestBuilder (fill_url / fill_headers /
# get_body) fills everything correctly. Depends only on my-http-utils (macros come via the
# `my_http_utils::macros` re-export — never the proc-macro crate directly).
[package]
name = "my-http-utils-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# `server` is enabled so the parse-side tests can exercise the derive-generated `parse`
# and the `my_http_utils::http_input` runtime. The client-builder tests are unaffected.
my-http-utils = { path = "..", features = ["server"] }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }

[dev-dependencies]
# Only the body-stream tests need a runtime: they play the role my-http-server plays in
# production — spawning a pump that fills the sending half of the channel. The library itself
# still uses nothing but `tokio/sync`.
tokio = { version = "*", features = ["rt", "macros", "time"] }
