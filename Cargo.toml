[workspace]
members = ["http-request-schema-macros", "tests"]

[package]
name = "my-http-utils"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Server-side request parsing (`http_input` parse engine + the derive-generated sync `parse` /
# `READS_BODY` / OpenAPI schema). Off by default so wasm clients pull only the client request
# builder. The whole layer is wasm-safe (no hyper), so enabling `server` still compiles for
# `wasm32-unknown-unknown` — it is simply not needed by browser clients.
#
# Note `http_input::HttpBodyAsStream` and its channel are NOT behind this feature: the same channel
# streams an incoming body on the server and an outgoing one on the client, so both sides need it.
server = ["http-request-schema-macros/server"]

[dependencies]
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }
serde = { version = "*" }
serde_json = { version = "*" }
# The JSON engine for both directions, allocation-light and wasm-safe:
#   * client (always on) — `JsonObjectWriter` builds the `#[http_body]` request body straight into
#     one String buffer (no `serde_json::Map` / per-field `to_value` / HashMap);
#   * server (`server` feature) — `JsonValueRef` reads named body members lazily, zero-copy, keeping
#     each member's verbatim source text.
my-json = { tag = "0.3.2", git = "https://github.com/MyJetTools/my-json.git" }
# Re-exported as `my_http_utils::macros` so consumers use the derives via my-http-utils, not the
# proc-macro crate directly. Proc-macro crates are host-only, so this does not affect wasm.
http-request-schema-macros = { path = "http-request-schema-macros" }
# ONLY `sync` — the mpsc channel + `Mutex` behind `http_input::HttpBodyAsStream`, nothing else.
# Unconditional (not feature-gated): the same channel carries a streamed body in BOTH directions,
# so a client that never enables `server` needs it too, in order to SEND a body as a stream.
# `default-features = false` keeps the runtime, mio and every transport out, so this stays
# platform-independent and compiles for `wasm32-unknown-unknown`.
tokio = { version = "*", default-features = false, features = ["sync"] }

[dev-dependencies]
# A runtime, for tests only. The library itself never needs one — it owns a channel, not a pump.
# These live here (not in the `tests` workspace member, which always enables `server`) so the
# CLIENT streaming path is exercised by a plain `cargo test`, with NO features on.
tokio = { version = "*", features = ["rt", "macros"] }
