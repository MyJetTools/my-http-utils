[workspace]
members = ["http-request-schema-macros", "tests"]

[package]
name = "my-http-utils"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Server-side request parsing (`http_input` module + the derive-generated sync `parse` /
# `READS_BODY`). Off by default so wasm clients pull only the schema + client request builder.
# The whole `http_input` layer is wasm-safe (no hyper/tokio), so enabling `server` still
# compiles for `wasm32-unknown-unknown` — it is simply not needed by browser clients.
server = ["http-request-schema-macros/server"]

[dependencies]
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }
serde = { version = "*" }
serde_json = { version = "*" }
# Re-exported as `my_http_utils::macros` so consumers use the derives via my-http-utils, not the
# proc-macro crate directly. Proc-macro crates are host-only, so this does not affect wasm.
http-request-schema-macros = { path = "http-request-schema-macros" }
